name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The advisory database moves even when the code does not, so re-audit
    # weekly rather than only on a push.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml is the single source of truth for the version and
      # components; `rustup show` installs exactly what it names.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Migrations are embedded at compile time, so clippy needs no database.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned: the schema needs xid8 / pg_current_xact_id(), which do not
        # exist before Postgres 13.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Set, so the suite uses this service container rather than starting its
      # own via testcontainers.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ledger

    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-features --locked -- --nocapture

  audit:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A ledger's dependency tree is part of its attack surface; a known-
      # vulnerable transitive crate should fail the build, not wait for someone
      # to notice.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Builds the deployable artifact on every change, so the Dockerfile
      # cannot silently rot while the crate keeps compiling.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
